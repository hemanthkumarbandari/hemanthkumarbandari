<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" role="presentation">
<defs>
  <linearGradient id="dg" x1="0" x2="1">
    <stop offset="0%" stop-color="#00F7FF" stop-opacity="0"/>
    <stop offset="50%" stop-color="#00F7FF"/>
    <stop offset="100%" stop-color="#00F7FF" stop-opacity="0"/>
  </linearGradient>
</defs>
<line x1="0" y1="12" x2="1200" y2="12" stroke="#151C26" stroke-width="1"/>
<!-- Moving energy pulse -->
<rect y="10" width="280" height="4" fill="url(#dg)">
  <animate attributeName="x" values="-280;1200;-280" dur="4s" repeatCount="indefinite"/>
</rect>
<!-- Center diamond ornament -->
<rect x="597" y="8" width="6" height="8" fill="#0A0C10" stroke="#00F7FF" stroke-width="0.8" stroke-opacity="0.6" transform="rotate(45 600 12)"/>
<!-- Tick marks -->
<line x1="200" y1="9" x2="200" y2="15" stroke="#00F7FF" stroke-width="0.5" opacity="0.3"/>
<line x1="400" y1="10" x2="400" y2="14" stroke="#00F7FF" stroke-width="0.5" opacity="0.2"/>
<line x1="800" y1="10" x2="800" y2="14" stroke="#00F7FF" stroke-width="0.5" opacity="0.2"/>
<line x1="1000" y1="9" x2="1000" y2="15" stroke="#00F7FF" stroke-width="0.5" opacity="0.3"/>
</svg>
