<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160" role="img" aria-label="Footer: Designed and engineered by Hemanth, BuildHive">
<defs>
  <linearGradient id="bg-f" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#050709"/>
    <stop offset="100%" stop-color="#070A10"/>
  </linearGradient>
  <linearGradient id="line-f" x1="0" x2="1">
    <stop offset="0%" stop-color="#00F7FF" stop-opacity="0"/>
    <stop offset="20%" stop-color="#00F7FF" stop-opacity="0.4"/>
    <stop offset="80%" stop-color="#00F7FF" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#00F7FF" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="cf"><rect width="1200" height="160"/></clipPath>
</defs>
<g clip-path="url(#cf)">
  <rect width="1200" height="160" fill="url(#bg-f)"/>

  <!-- Top separator -->
  <line x1="0" y1="0.5" x2="1200" y2="0.5" stroke="#1B222C" stroke-width="1"/>

  <!-- Side accent lines -->
  <line x1="60" y1="20" x2="60" y2="140" stroke="#00F7FF" stroke-width="0.5" opacity="0.2"/>
  <line x1="1140" y1="20" x2="1140" y2="140" stroke="#00F7FF" stroke-width="0.5" opacity="0.2"/>

  <!-- Left bracket decorations -->
  <path d="M40,65 L60,65" stroke="#00F7FF" stroke-width="1" opacity="0.4"/>
  <path d="M40,95 L60,95" stroke="#00F7FF" stroke-width="1" opacity="0.4"/>

  <!-- Right bracket decorations -->
  <path d="M1140,65 L1160,65" stroke="#00F7FF" stroke-width="1" opacity="0.4"/>
  <path d="M1140,95 L1160,95" stroke="#00F7FF" stroke-width="1" opacity="0.4"/>

  <!-- Opening quote ghost -->
  <text x="258" y="88" font-family="Georgia,serif" font-size="52" fill="#00F7FF" opacity="0.08">"</text>

  <!-- Main tagline -->
  <text x="600" y="78" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="18" fill="#E6EDF3" text-anchor="middle" letter-spacing="1">I build things that make people scroll back up.</text>

  <!-- Attribution -->
  <text x="600" y="104" font-family="ui-monospace,monospace" font-size="12" fill="#8B949E" text-anchor="middle" letter-spacing="2">— Hemanth Kumar Bandari</text>

  <!-- Bottom credit line -->
  <line x1="100" y1="130" x2="1100" y2="130" stroke="url(#line-f)" stroke-width="0.5"/>
  <text x="600" y="148" font-family="ui-monospace,monospace" font-size="10" fill="#2A3140" text-anchor="middle" letter-spacing="2">DESIGNED &amp; ENGINEERED BY HEMANTH  ·  BUILDHIVE STUDIO  ·  2026</text>

  <!-- Moving pulse on bottom line -->
  <circle cy="130" r="2.5" fill="#00F7FF" opacity="0.8">
    <animate attributeName="cx" values="100;1100;100" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </circle>

  <!-- Pulsing side nodes -->
  <circle cx="60" cy="80" r="2" fill="#00F7FF" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1140" cy="80" r="2" fill="#00F7FF" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>
</g>
</svg>
