<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Technical arsenal: Frontend, Backend, Data, Tools">
<defs>
  <linearGradient id="bg-s" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#070A10"/>
    <stop offset="100%" stop-color="#050709"/>
  </linearGradient>
  <linearGradient id="g-fe" x1="0" x2="1"><stop offset="0%" stop-color="#00F7FF"/><stop offset="100%" stop-color="#00C8FF"/></linearGradient>
  <linearGradient id="g-be" x1="0" x2="1"><stop offset="0%" stop-color="#7B2FFF"/><stop offset="100%" stop-color="#A56DFF"/></linearGradient>
  <linearGradient id="g-db" x1="0" x2="1"><stop offset="0%" stop-color="#F7CC6C"/><stop offset="100%" stop-color="#FFD97D"/></linearGradient>
  <linearGradient id="g-tl" x1="0" x2="1"><stop offset="0%" stop-color="#8B949E"/><stop offset="100%" stop-color="#A0ACBA"/></linearGradient>
  <clipPath id="cs"><rect width="1200" height="220"/></clipPath>
</defs>
<g clip-path="url(#cs)">
  <rect width="1200" height="220" fill="url(#bg-s)"/>

  <!-- FRONTEND Panel: x=26 -->
  <rect x="26" y="10" width="268" height="200" rx="8" fill="#0A0C10" stroke="#1B222C" stroke-width="1"/>
  <rect x="26" y="10" width="268" height="3" rx="2" fill="url(#g-fe)"/>
  <text x="160" y="34" font-family="ui-monospace,monospace" font-size="10" fill="#00F7FF" text-anchor="middle" letter-spacing="3" font-weight="600">FRONTEND</text>
  <line x1="42" y1="43" x2="278" y2="43" stroke="#1B222C" stroke-width="1"/>

  <circle cx="45" cy="62" r="2" fill="#00F7FF" opacity="0.8"/>
  <text x="58" y="67" font-family="ui-monospace,monospace" font-size="12" fill="#E6EDF3">Next.js  ·  React</text>
  <circle cx="45" cy="88" r="2" fill="#00F7FF" opacity="0.6"/>
  <text x="58" y="93" font-family="ui-monospace,monospace" font-size="12" fill="#C4D0DC">Three.js  ·  GSAP</text>
  <circle cx="45" cy="114" r="2" fill="#00F7FF" opacity="0.5"/>
  <text x="58" y="119" font-family="ui-monospace,monospace" font-size="12" fill="#C4D0DC">TypeScript  ·  JS</text>
  <circle cx="45" cy="140" r="2" fill="#00F7FF" opacity="0.5"/>
  <text x="58" y="145" font-family="ui-monospace,monospace" font-size="12" fill="#C4D0DC">TailwindCSS  ·  CSS3</text>
  <circle cx="45" cy="166" r="2" fill="#00F7FF" opacity="0.3"/>
  <text x="58" y="171" font-family="ui-monospace,monospace" font-size="12" fill="#8B949E">Bootstrap  ·  Router</text>

  <!-- Active pulse on top item -->
  <circle cx="45" cy="62" r="5" fill="none" stroke="#00F7FF" stroke-width="0.5"><animate attributeName="r" values="5;11;5" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;0;0.3" dur="2.5s" repeatCount="indefinite"/></circle>

  <!-- BACKEND Panel: x=319 -->
  <rect x="319" y="10" width="268" height="200" rx="8" fill="#0A0C10" stroke="#1B222C" stroke-width="1"/>
  <rect x="319" y="10" width="268" height="3" rx="2" fill="url(#g-be)"/>
  <text x="453" y="34" font-family="ui-monospace,monospace" font-size="10" fill="#A56DFF" text-anchor="middle" letter-spacing="3" font-weight="600">BACKEND</text>
  <line x1="335" y1="43" x2="571" y2="43" stroke="#1B222C" stroke-width="1"/>

  <circle cx="338" cy="62" r="2" fill="#7B2FFF" opacity="0.9"/>
  <text x="351" y="67" font-family="ui-monospace,monospace" font-size="12" fill="#E6EDF3">Node.js  ·  Express</text>
  <circle cx="338" cy="88" r="2" fill="#7B2FFF" opacity="0.7"/>
  <text x="351" y="93" font-family="ui-monospace,monospace" font-size="12" fill="#C4D0DC">Python</text>
  <circle cx="338" cy="114" r="2" fill="#7B2FFF" opacity="0.6"/>
  <text x="351" y="119" font-family="ui-monospace,monospace" font-size="12" fill="#C4D0DC">REST APIs</text>
  <circle cx="338" cy="140" r="2" fill="#7B2FFF" opacity="0.5"/>
  <text x="351" y="145" font-family="ui-monospace,monospace" font-size="12" fill="#C4D0DC">Jenkins  ·  CI/CD</text>
  <circle cx="338" cy="166" r="2" fill="#7B2FFF" opacity="0.3"/>
  <text x="351" y="171" font-family="ui-monospace,monospace" font-size="12" fill="#8B949E">Docker</text>

  <circle cx="338" cy="62" r="5" fill="none" stroke="#7B2FFF" stroke-width="0.5"><animate attributeName="r" values="5;11;5" dur="3.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;0;0.3" dur="3.1s" repeatCount="indefinite"/></circle>

  <!-- DATA Panel: x=612 -->
  <rect x="612" y="10" width="268" height="200" rx="8" fill="#0A0C10" stroke="#1B222C" stroke-width="1"/>
  <rect x="612" y="10" width="268" height="3" rx="2" fill="url(#g-db)"/>
  <text x="746" y="34" font-family="ui-monospace,monospace" font-size="10" fill="#F7CC6C" text-anchor="middle" letter-spacing="3" font-weight="600">DATA</text>
  <line x1="628" y1="43" x2="864" y2="43" stroke="#1B222C" stroke-width="1"/>

  <circle cx="631" cy="62" r="2" fill="#F7CC6C" opacity="0.9"/>
  <text x="644" y="67" font-family="ui-monospace,monospace" font-size="12" fill="#E6EDF3">MongoDB  ·  MySQL</text>
  <circle cx="631" cy="88" r="2" fill="#F7CC6C" opacity="0.7"/>
  <text x="644" y="93" font-family="ui-monospace,monospace" font-size="12" fill="#C4D0DC">Pandas  ·  Matplotlib</text>
  <circle cx="631" cy="114" r="2" fill="#F7CC6C" opacity="0.5"/>
  <text x="644" y="119" font-family="ui-monospace,monospace" font-size="12" fill="#C4D0DC">Power BI</text>
  <circle cx="631" cy="140" r="2" fill="#F7CC6C" opacity="0.3"/>
  <text x="644" y="145" font-family="ui-monospace,monospace" font-size="12" fill="#8B949E">Jupyter</text>

  <circle cx="631" cy="62" r="5" fill="none" stroke="#F7CC6C" stroke-width="0.5"><animate attributeName="r" values="5;11;5" dur="2.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;0;0.3" dur="2.8s" repeatCount="indefinite"/></circle>

  <!-- TOOLS Panel: x=905 -->
  <rect x="905" y="10" width="268" height="200" rx="8" fill="#0A0C10" stroke="#1B222C" stroke-width="1"/>
  <rect x="905" y="10" width="268" height="3" rx="2" fill="url(#g-tl)"/>
  <text x="1039" y="34" font-family="ui-monospace,monospace" font-size="10" fill="#8B949E" text-anchor="middle" letter-spacing="3" font-weight="600">TOOLS</text>
  <line x1="921" y1="43" x2="1157" y2="43" stroke="#1B222C" stroke-width="1"/>

  <circle cx="924" cy="62" r="2" fill="#8B949E" opacity="0.9"/>
  <text x="937" y="67" font-family="ui-monospace,monospace" font-size="12" fill="#E6EDF3">Git  ·  GitHub</text>
  <circle cx="924" cy="88" r="2" fill="#8B949E" opacity="0.7"/>
  <text x="937" y="93" font-family="ui-monospace,monospace" font-size="12" fill="#C4D0DC">VS Code  ·  Postman</text>
  <circle cx="924" cy="114" r="2" fill="#8B949E" opacity="0.6"/>
  <text x="937" y="119" font-family="ui-monospace,monospace" font-size="12" fill="#C4D0DC">Vercel  ·  Netlify</text>
  <circle cx="924" cy="140" r="2" fill="#8B949E" opacity="0.5"/>
  <text x="937" y="145" font-family="ui-monospace,monospace" font-size="12" fill="#C4D0DC">Figma  ·  Canva</text>
  <circle cx="924" cy="166" r="2" fill="#8B949E" opacity="0.3"/>
  <text x="937" y="171" font-family="ui-monospace,monospace" font-size="12" fill="#8B949E">Postman  ·  Jupyter</text>
</g>
</svg>
