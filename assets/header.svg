<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Hemanth Kumar Bandari, developer and designer, founder of BuildHive">
<defs>
  <clipPath id="rr"><rect width="1200" height="380" rx="14"/></clipPath>
  <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
  <radialGradient id="glow" cx="78%" cy="50%" r="45%"><stop offset="0" stop-color="#00F7FF" stop-opacity=".10"/><stop offset="1" stop-color="#00F7FF" stop-opacity="0"/></radialGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00F7FF" stop-opacity="0"/><stop offset="1" stop-color="#00F7FF" stop-opacity=".10"/></linearGradient>
</defs>
<style>
  .m{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
  .s{font-family:Georgia,'Times New Roman',serif}
  .rise{opacity:0;animation:rise 1.2s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .blink{animation:blink 1.4s steps(2,start) infinite}
  @keyframes blink{50%{opacity:0}}
  .flow{stroke-dasharray:2 8;animation:flow 8s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-100}}
</style>
<g clip-path="url(#rr)">
  <rect width="1200" height="380" fill="#0A0C10"/>
  <rect width="1200" height="380" fill="url(#g)"/>
  <rect width="1200" height="380" fill="url(#glow)"/>

  <!-- constellation -->
  <g stroke="#00F7FF" stroke-opacity=".22" fill="none">
    <path class="flow" d="M540 40L620 60L700 110L780 50"/>
    <path class="flow" d="M620 60L560 150L640 250L720 320"/>
    <path class="flow" d="M700 110L640 250"/>
    <path class="flow" d="M1090 70L1120 160L1060 300L1000 350"/>
    <path class="flow" d="M1090 70L780 50"/>
    <path class="flow" d="M500 330L640 250"/>
  </g>
  <g fill="#00F7FF">
    <circle cx="540" cy="40" r="2.5" opacity=".5"><animate attributeName="opacity" values=".15;.8;.15" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="60" r="2.5" opacity=".5"><animate attributeName="opacity" values=".15;.8;.15" dur="5s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="110" r="2.5" opacity=".5"><animate attributeName="opacity" values=".15;.8;.15" dur="6s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="50" r="2.5" opacity=".5"><animate attributeName="opacity" values=".15;.8;.15" dur="4.5s" begin="-3s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="150" r="2.5" opacity=".5"><animate attributeName="opacity" values=".15;.8;.15" dur="5.5s" begin="-.5s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="250" r="2.5" opacity=".5"><animate attributeName="opacity" values=".15;.8;.15" dur="4.2s" begin="-2.5s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="320" r="2.5" opacity=".5"><animate attributeName="opacity" values=".15;.8;.15" dur="6.5s" begin="-4s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="70" r="2.5" opacity=".5"><animate attributeName="opacity" values=".15;.8;.15" dur="5s" begin="-1.5s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="160" r="2.5" opacity=".5"><animate attributeName="opacity" values=".15;.8;.15" dur="4s" begin="-3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="300" r="2.5" opacity=".5"><animate attributeName="opacity" values=".15;.8;.15" dur="5.8s" begin="-2.2s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="350" r="2.5" opacity=".5"><animate attributeName="opacity" values=".15;.8;.15" dur="4.8s" begin="-.8s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="330" r="2.5" opacity=".5"><animate attributeName="opacity" values=".15;.8;.15" dur="5.2s" begin="-3.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- wireframe globe -->
  <g transform="translate(900 190)" fill="none" stroke="#00F7FF">
    <circle r="120" stroke-opacity=".55"/>
    <ellipse cy="-80" rx="89.4" ry="16" stroke-opacity=".18"/>
    <ellipse cy="-40" rx="113" ry="20" stroke-opacity=".18"/>
    <ellipse cy="0" rx="120" ry="22" stroke-opacity=".28"/>
    <ellipse cy="40" rx="113" ry="20" stroke-opacity=".18"/>
    <ellipse cy="80" rx="89.4" ry="16" stroke-opacity=".18"/>
    <g stroke-opacity=".32">
      <ellipse ry="120" rx="120"><animate attributeName="rx" values="120;85;0;85;120" dur="12s" begin="0s" repeatCount="indefinite"/></ellipse>
      <ellipse ry="120" rx="104"><animate attributeName="rx" values="120;85;0;85;120" dur="12s" begin="-2s" repeatCount="indefinite"/></ellipse>
      <ellipse ry="120" rx="60"><animate attributeName="rx" values="120;85;0;85;120" dur="12s" begin="-4s" repeatCount="indefinite"/></ellipse>
      <ellipse ry="120" rx="0"><animate attributeName="rx" values="120;85;0;85;120" dur="12s" begin="-6s" repeatCount="indefinite"/></ellipse>
      <ellipse ry="120" rx="60"><animate attributeName="rx" values="120;85;0;85;120" dur="12s" begin="-8s" repeatCount="indefinite"/></ellipse>
      <ellipse ry="120" rx="104"><animate attributeName="rx" values="120;85;0;85;120" dur="12s" begin="-10s" repeatCount="indefinite"/></ellipse>
    </g>
    <g transform="rotate(-22)">
      <ellipse rx="182" ry="46" stroke-opacity=".30" stroke-dasharray="2 7"/>
      <circle r="4" fill="#00F7FF" stroke="none"><animateMotion dur="14s" repeatCount="indefinite" path="M-182,0 A182,46 0 1,1 182,0 A182,46 0 1,1 -182,0"/></circle>
    </g>
    <g transform="rotate(28)">
      <ellipse rx="156" ry="34" stroke-opacity=".20" stroke-dasharray="1 9"/>
      <circle r="3" fill="#F2F4F8" stroke="none"><animateMotion dur="20s" repeatCount="indefinite" path="M156,0 A156,34 0 1,0 -156,0 A156,34 0 1,0 156,0"/></circle>
    </g>
  </g>

  <!-- scan line -->
  <rect width="1200" height="110" fill="url(#scan)" opacity=".6">
    <animate attributeName="y" values="-110;380" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- type -->
  <text class="m rise" x="70" y="78" font-size="13" fill="#5C6673" letter-spacing="2" style="animation-delay:.1s">// PROFILE.README &#183; 17.3850&#176;N 78.4867&#176;E</text>
  <text class="s rise" x="66" y="176" font-size="80" fill="#F2F4F8" letter-spacing="-2" style="animation-delay:.3s">Hemanth Kumar</text>
  <text class="s rise" x="66" y="258" font-size="80" font-style="italic" fill="#00F7FF" letter-spacing="-2" style="animation-delay:.55s">Bandari<tspan fill="#F2F4F8" font-style="normal">.</tspan></text>
  <text class="m rise" x="70" y="304" font-size="15" fill="#8B949E" letter-spacing=".5" style="animation-delay:.9s">developer &#215; designer &#183; founder, BuildHive</text>
  <g class="rise" style="animation-delay:1.2s">
    <circle cx="74" cy="342" r="4" fill="#00F7FF" class="blink"/>
    <text class="m" x="90" y="346" font-size="12" fill="#5C6673" letter-spacing="1.5">OPEN TO FREELANCE WORK</text>
  </g>
</g>
<rect x=".5" y=".5" width="1199" height="379" rx="14" fill="none" stroke="#1B222C"/>
</svg>
